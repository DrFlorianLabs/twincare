name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: BackEnd
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Test and verify
        run: sh ./mvnw --batch-mode --no-transfer-progress clean verify
      - name: Package the isolated demo profile
        run: sh ./mvnw --batch-mode --no-transfer-progress -Pdemo -DskipTests clean package

  frontend:
    name: Frontend build (${{ matrix.app }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - app: patient
            directory: FrontEnd/app_twin-care
            lockfile: FrontEnd/app_twin-care/package-lock.json
            typecheck: true
          - app: back-office
            directory: FrontEnd/back-office_twin-care
            lockfile: FrontEnd/back-office_twin-care/package-lock.json
            typecheck: false
    defaults:
      run:
        working-directory: ${{ matrix.directory }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: ${{ matrix.lockfile }}
      - name: Use the locally verified npm release
        run: npm install --global npm@10.9.9 --no-audit --no-fund --fetch-timeout=30000 --fetch-retries=1
      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund --fetch-timeout=30000 --fetch-retries=1
      - name: Unit tests
        if: matrix.app == 'back-office'
        run: npm run test:unit
      - name: Patient journey unit tests
        if: matrix.app == 'patient'
        run: npm test
      - name: Type-check patient application
        if: matrix.typecheck
        run: npm run type-check
      - name: Check integrated demo JavaScript
        if: matrix.app == 'patient'
        run: node --check ../../BackEnd/src/main/resources/static/demo/app.js
      - name: Build
        run: npm run build
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high --fetch-timeout=30000 --fetch-retries=1
