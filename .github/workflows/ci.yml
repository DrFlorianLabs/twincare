name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: BackEnd
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Test
        run: sh ./mvnw --batch-mode --no-transfer-progress test

  frontend:
    name: Frontend build (${{ matrix.app }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - app: patient
            directory: FrontEnd/app_twin-care
            lockfile: FrontEnd/app_twin-care/package-lock.json
          - app: back-office
            directory: FrontEnd/back-office_twin-care
            lockfile: FrontEnd/back-office_twin-care/package-lock.json
    defaults:
      run:
        working-directory: ${{ matrix.directory }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: ${{ matrix.lockfile }}
      - name: Install locked dependencies
        run: npm ci
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high
      - name: Unit tests
        if: matrix.app == 'back-office'
        run: npm run test:unit
      - name: Patient journey unit tests
        if: matrix.app == 'patient'
        run: npm test
      - name: Build
        run: npm run build
