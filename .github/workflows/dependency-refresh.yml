name: Dependency lock refresh

on:
  pull_request:

permissions:
  contents: write

jobs:
  refresh:
    name: Refresh and commit dependency locks
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            FrontEnd/app_twin-care/package-lock.json
            FrontEnd/back-office_twin-care/package-lock.json
      - name: Refresh patient lock within declared ranges
        working-directory: FrontEnd/app_twin-care
        run: |
          npm audit fix --package-lock-only
          npm audit --omit=dev --audit-level=high
      - name: Refresh back-office lock within declared ranges
        working-directory: FrontEnd/back-office_twin-care
        run: |
          npm audit fix --package-lock-only
          npm audit --omit=dev --audit-level=high
      - name: Commit refreshed locks
        run: |
          if git diff --quiet -- FrontEnd/app_twin-care/package-lock.json FrontEnd/back-office_twin-care/package-lock.json; then
            echo "Dependency locks already current"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add FrontEnd/app_twin-care/package-lock.json FrontEnd/back-office_twin-care/package-lock.json
          git commit -m "Patch vulnerable frontend dependency locks"
          git push origin HEAD:${{ github.head_ref }}
