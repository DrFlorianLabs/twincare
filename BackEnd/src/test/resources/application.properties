spring.datasource.url=jdbc:h2:mem:twincare_test;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

spring.flyway.enabled=false

file.upload-dir=${java.io.tmpdir}/twincare-test-uploads
file.max-size-bytes=10485760

jwt.secret=synthetic-test-secret-material-32-bytes-minimum-only
jwt.expiration=3600000
app.cors.allowed-origins=http://localhost:5173
springdoc.api-docs.enabled=false
springdoc.swagger-ui.enabled=false

server.error.include-message=never
server.error.include-stacktrace=never
spring.jackson.deserialization.fail-on-unknown-properties=true
app.preparation.token-pepper=synthetic-test-patient-token-pepper-at-least-32-bytes
app.preparation.token-key-id=test-v1
app.preparation.invitation-ttl=PT72H
app.preparation.exchange-rate-limit-per-minute=1000
app.preparation.patient-session-cookie-secure=true
app.preparation.patient-cors.allowed-origins=http://localhost:3000
app.preparation.attachment-storage-dir=${java.io.tmpdir}/twincare-test-preparation-attachments-${random.uuid}
app.preparation.attachment-max-size-bytes=10485760
app.preparation.attachment-orphan-grace=PT1H
spring.servlet.multipart.location=${java.io.tmpdir}/twincare-test-private-multipart-${random.uuid}
