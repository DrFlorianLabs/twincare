server.port=${PORT:8080}

spring.datasource.url=${JDBC_DATABASE_URL}
spring.datasource.username=${JDBC_DATABASE_USERNAME}
spring.datasource.password=${JDBC_DATABASE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

file.upload-dir=${FILE_UPLOAD_DIR:./data/uploads}
file.max-size-bytes=${FILE_MAX_SIZE_BYTES:10485760}
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# Required. No insecure fallback is intentionally provided.
jwt.secret=${JWT_SECRET}
jwt.expiration=${JWT_EXPIRATION_MS:3600000}

# Comma-separated origins. Production deployments must set this explicitly.
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000,http://localhost:3001}

logging.level.backend=INFO
server.error.include-message=never
server.error.include-stacktrace=never

spring.mvc.pathmatch.matching-strategy=ant_path_matcher
spring.jackson.deserialization.fail-on-unknown-properties=true

# Required HMAC key for one-time patient invitations and scoped access sessions.
# Keep it separate from the JWT secret and rotate it through controlled reissuance.
app.preparation.token-pepper=${PATIENT_INVITATION_TOKEN_PEPPER}
app.preparation.token-key-id=${PATIENT_INVITATION_TOKEN_KEY_ID:v1}
app.preparation.invitation-ttl=${PATIENT_INVITATION_TTL:PT72H}
app.preparation.exchange-rate-limit-per-minute=${PATIENT_INVITATION_EXCHANGE_RATE_LIMIT:120}
app.preparation.patient-session-cookie-secure=${PATIENT_SESSION_COOKIE_SECURE:true}
# Dedicated patient frontend origin(s). Do not include professional application origins.
app.preparation.patient-cors.allowed-origins=${PATIENT_CORS_ALLOWED_ORIGINS:http://localhost:3000}

# API documentation is an explicit administrative deployment option.
springdoc.api-docs.enabled=${SPRINGDOC_ENABLED:false}
springdoc.swagger-ui.enabled=${SPRINGDOC_ENABLED:false}

spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
# Legacy databases predate Flyway. Baseline them after the destructive prototype
# migrations V3/V4 instead of replaying those migrations over existing tables.
spring.flyway.baseline-version=${FLYWAY_BASELINE_VERSION:4}
spring.flyway.validate-migration-naming=true
spring.flyway.out-of-order=false
