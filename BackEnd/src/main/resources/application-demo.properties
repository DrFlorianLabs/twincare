# Local synthetic demonstration only. DemoEnvironmentGuard rejects any
# non-loopback binding or non-isolated database configuration.
server.address=127.0.0.1
server.port=${DEMO_PORT:8088}

spring.datasource.url=jdbc:h2:file:./.twincare-demo/twincare;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

spring.flyway.baseline-on-migrate=false
springdoc.api-docs.enabled=false
springdoc.swagger-ui.enabled=false

app.cors.allowed-origins=http://127.0.0.1:${DEMO_PORT:8088}
app.preparation.patient-cors.allowed-origins=http://127.0.0.1:${DEMO_PORT:8088}
app.preparation.patient-session-cookie-secure=false
app.preparation.attachment-storage-dir=./.twincare-demo/attachments
spring.servlet.multipart.location=./.twincare-demo/multipart
file.upload-dir=./.twincare-demo/legacy-uploads

logging.level.root=WARN
logging.level.backend=WARN
server.error.include-message=never
server.error.include-stacktrace=never
